<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Mod Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&family=Style+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: rgb(236, 236, 232);
      font-family: "Atkinson Hyperlegible", Arial, sans-serif;
    }

    body::-webkit-scrollbar {
      width: 12px;
    }

    body::-webkit-scrollbar-track {
      background-color: gray;
    }

    body::-webkit-scrollbar-thumb {
      border: solid rgb(53, 53, 53) 3px;
      background-color: rgb(236, 236, 233);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .background {
      position: absolute;
      inset: 0;
      background-image: url("src/components/Content/imagies/rain-fon2.jpg");
      background-position: center;
      background-size: cover;
      box-shadow: inset #000 0 -60px 70px 80px;
      opacity: 1;
      z-index: -1;
      transition: opacity 900ms ease;
    }

    .background.is-fading {
      opacity: 0;
    }

    .header {
      height: 90px;
      padding: 20px;
      text-align: right;
    }

    .icon-button {
      appearance: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }

    .icon-button img {
      display: block;
      transition: transform 300ms ease;
    }

    .icon-button:hover img {
      transform: scale(1.1);
    }

    .rain-button img {
      width: 70px;
    }

    .content {
      width: min(500px, calc(100% - 32px));
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 60px 0 20px;
      font-size: clamp(38px, 9vw, 50px);
      line-height: 1.1;
      font-weight: 800;
    }

    .play-button {
      margin-top: 8px;
    }

    .play-button img {
      width: 90px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin: 50px auto 30px;
    }

    .socials img {
      width: 40px;
      display: block;
      transition: transform 300ms ease;
    }

    .socials a:hover img,
    .stores a:hover img {
      transform: scale(1.08);
    }

    .stores {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 30px auto;
    }

    .stores img {
      width: min(220px, 42vw);
      display: block;
      transition: transform 300ms ease;
    }

    .video-section {
      position: relative;
      min-height: 500px;
      padding: 80px min(10vw, 150px);
      overflow: hidden;
    }

    .video-section::before {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset #000 0 60px 70px 80px;
      pointer-events: none;
      z-index: 1;
    }

    .video-section video {
      width: 100%;
      opacity: 0.7;
      display: block;
    }

    footer {
      padding: 60px 16px 40px;
      text-align: center;
      color: #fff;
      font-family: "Style Script", cursive;
      font-size: 24px;
    }

    footer a {
      color: #fff;
    }

    @media (max-width: 560px) {
      .socials {
        gap: 34px;
      }

      .video-section {
        min-height: 300px;
        padding: 48px 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="background" id="background"></div>
      <header class="header">
        <button class="icon-button rain-button" id="rainButton" type="button" aria-label="Play rain sound">
          <img src="src/components/Content/ContentComponents/Header/imagies/rain-logo.png" alt="">
        </button>
      </header>

      <section class="content" aria-label="Rain player">
        <h1>Rain Mod Player</h1>
        <button class="icon-button play-button" id="songButton" type="button" aria-label="Play music">
          <img src="src/components/Content/ContentComponents/MidleContent/imagies/play4.png" alt="">
        </button>

        <nav class="socials" aria-label="Social links">
          <a href="https://telegram.org/" rel="noreferrer" target="_blank">
            <img src="src/components/Content/ContentComponents/MidleContent/imagies/telegram.png" alt="Telegram">
          </a>
          <a href="https://www.instagram.com/" rel="noreferrer" target="_blank">
            <img src="src/components/Content/ContentComponents/MidleContent/imagies/instagram.png" alt="Instagram">
          </a>
          <a href="https://ru-ru.facebook.com/" rel="noreferrer" target="_blank">
            <img src="src/components/Content/ContentComponents/MidleContent/imagies/facebook.png" alt="Facebook">
          </a>
        </nav>

        <div class="stores">
          <a href="https://play.google.com/store" rel="noreferrer" target="_blank">
            <img src="src/components/Content/ContentComponents/MidleContent/imagies/gp.png" alt="Google Play">
          </a>
          <a href="https://play.google.com/store" rel="noreferrer" target="_blank">
            <img src="src/components/Content/ContentComponents/MidleContent/imagies/gp.png" alt="Google Play">
          </a>
        </div>
      </section>
    </section>

    <section class="video-section" aria-label="Rain video">
      <video autoplay loop muted playsinline>
        <source src="src/components/Content/imagies/video.mp4" type="video/mp4">
      </video>
    </section>
  </main>

  <footer>
    <div>@2021 <a href="https://www.instagram.com/lizard_el_org/">My Instagram</a>. Rain mod player for you. <a href="https://vk.com/jotarokujo4242">My VK</a></div>
    <div>This site uses cookies. <a href="https://rainymood.com/privacy-app.php">Privaci politic</a></div>
  </footer>

  <script>
    const background = document.getElementById("background");
    const rainButton = document.getElementById("rainButton");
    const songButton = document.getElementById("songButton");

    const backgrounds = [
      "src/components/Content/imagies/rain-fon2.jpg",
      "src/components/Content/imagies/rain-fon.jpg",
      "src/components/Content/imagies/rain-fon3.jpg"
    ];

    let backgroundIndex = 0;
    let rainIsPlaying = false;
    let songIsPlaying = false;
    const rainAudio = new Audio("src/components/Content/ContentComponents/Header/imagies/song2.mp3");
    let songAudio = new Audio("src/components/Content/ContentComponents/MidleContent/imagies/song1.mp3");

    rainAudio.loop = true;
    rainAudio.volume = 0.2;

    function slideBackground() {
      background.classList.add("is-fading");
      setTimeout(() => {
        backgroundIndex = (backgroundIndex + 1) % backgrounds.length;
        background.style.backgroundImage = `url("${backgrounds[backgroundIndex]}")`;
        background.classList.remove("is-fading");
      }, 900);
    }

    async function toggleAudio(audio, isPlaying, onPause) {
      if (isPlaying) {
        audio.pause();
        if (onPause) {
          onPause();
        }
        return false;
      }

      try {
        await audio.play();
        return true;
      } catch (error) {
        console.error("Audio playback failed:", error);
        return false;
      }
    }

    rainButton.addEventListener("click", async () => {
      rainIsPlaying = await toggleAudio(rainAudio, rainIsPlaying);
    });

    songButton.addEventListener("click", async () => {
      songIsPlaying = await toggleAudio(songAudio, songIsPlaying, () => {
        songAudio.currentTime = 0;
      });
    });

    setInterval(slideBackground, 10000);
  </script>
</body>
</html>
